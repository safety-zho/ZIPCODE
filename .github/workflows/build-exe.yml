# GitHub에 올리면 Windows 서버에서 자동으로 ZipcodeFiller.exe 를 만든다.
# 결과: 저장소의 Actions 탭 → 가장 최근 실행 → Artifacts 의 ZipcodeFiller-windows
name: Build Windows exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --name ZipcodeFiller --add-data "static;static" app.py

      - name: Check the exe starts
        shell: pwsh
        run: |
          $env:OPEN_BROWSER = "0"; $env:PORT = "8123"
          $p = Start-Process -FilePath "dist\ZipcodeFiller.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8123/api/config" -UseBasicParsing
              $ok = $r.Content -match "manual_search_url"
              $page = Invoke-WebRequest -Uri "http://127.0.0.1:8123/" -UseBasicParsing
              $ok = $ok -and ($page.Content -match "zipBoxes")
            } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "exe did not start" }
          # 참고용: GitHub 서버(해외)에서 인터넷우체국 실제 조회. 해외 접속이 막히면 실패할 수 있어 빌드는 계속한다.
          # 결과는 실행 요약 화면(Annotations)에 표시된다.
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $lines = @()
          foreach ($addr in @("테헤란로 123", "남부순환로 2620", "송파대로 145")) {
            try {
              $body = (@{ address = $addr } | ConvertTo-Json -Compress)
              $res = Invoke-WebRequest -Uri "http://127.0.0.1:8123/api/search" -Method Post -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes($body)) -UseBasicParsing
              $j = [Text.Encoding]::UTF8.GetString($res.RawContentStream.ToArray()) | ConvertFrom-Json
              $c = @($j.candidates)
              if ($c.Count -eq 0) { $lines += "$addr → 결과 없음 (검색어: $($j.tried -join ' / '))" }
              else { $lines += "$addr → 후보 $($c.Count)건: " + (($c | Select-Object -First 3 | ForEach-Object { "$($_.zip) $($_.road)" }) -join ' | ') }
            } catch {
              $lines += "$addr → 조회 실패: $($_.ErrorDetails.Message) $($_.Exception.Message)"
            }
          }
          $msg = ($lines -join "`n")
          Write-Host $msg
          $esc = $msg.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host "::notice title=인터넷우체국 실제 조회 시험::$esc"
          Stop-Process -Id $p.Id -Force

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\ZipcodeFiller.exe out\
          Copy-Item .env.example out\

      - uses: actions/upload-artifact@v6
        with:
          name: ZipcodeFiller-windows
          path: out/
          retention-days: 90
