name: Live check
on:
  push:
    paths: ["config.js", "js/juso.js", "tests/live-check.js", ".github/workflows/live-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node tests/live-check.js
